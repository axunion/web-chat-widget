name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  bundle-size:
    runs-on: ubuntu-latest
    needs: test
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Report dist/chat-widget.iife.js size next to the baseline
        run: |
          echo "Baseline (bundle-size-baseline.json):"
          cat bundle-size-baseline.json
          echo
          echo "Current sizes:"
          echo "raw:  $(wc -c < dist/chat-widget.iife.js) bytes"
          echo "gzip: $(gzip -c dist/chat-widget.iife.js | wc -c) bytes"
